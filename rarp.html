<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RARP 分岐点 STORY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=DotGothic16&family=Press+Start+2P&family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column; four skins (novel / quiz show / RPG / arcade) restyle the same scene DOM; BAD END is a full-screen overlay */
:root{
  --bg:#EAF0EF;--surface:#FFFFFF;--ink:#132628;--muted:#506466;--line:#C7D5D3;--accent:#0C6A70;--accent-ink:#FFFFFF;--accent-soft:#D6E9E8;
  --stage:#0B1517;--stage-ink:#D8E6E4;--stage-dim:#7E9794;
  --best:#0F6E56;--ok:#1E40AF;--poor:#C2410C;--danger:#B91C1C;--best-soft:#DDF0E9;--ok-soft:#E1E7F8;--poor-soft:#F9E6DC;--danger-soft:#F8E0E0;
  --f-novel:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--f-dot:"DotGothic16","MS Gothic",monospace;--f-heavy:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;--f-arc:"Press Start 2P",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1819;--surface:#152325;--ink:#E1ECEA;--muted:#93A9A6;--line:#294043;--accent:#4DB2AE;--accent-ink:#06191A;--accent-soft:#163A3B;--stage:#050B0C;
  --best:#4CC59E;--ok:#8EA8F5;--poor:#F19560;--danger:#F07878;--best-soft:#123327;--ok-soft:#18233F;--poor-soft:#3A2116;--danger-soft:#3C1A1A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1819;--surface:#152325;--ink:#E1ECEA;--muted:#93A9A6;--line:#294043;--accent:#4DB2AE;--accent-ink:#06191A;--accent-soft:#163A3B;--stage:#050B0C;
  --best:#4CC59E;--ok:#8EA8F5;--poor:#F19560;--danger:#F07878;--best-soft:#123327;--ok-soft:#18233F;--poor-soft:#3A2116;--danger-soft:#3C1A1A;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;transition:background .4s}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-novel);font-weight:700;font-size:20px;margin-right:auto;letter-spacing:.03em}
.brand small{font-family:var(--f-ui);font-weight:500;font-size:11.5px;opacity:.7;margin-left:8px}
.ctl{all:unset;cursor:pointer;font-size:12px;border:1px solid currentColor;opacity:.75;border-radius:999px;padding:2px 10px}
.ctl:focus-visible,.sel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sel{font-size:12px;border-radius:999px;padding:2px 8px;background:transparent;color:inherit;border:1px solid currentColor;opacity:.85}
.sel option{color:#111}
.chip{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:0 8px;border-radius:3px;margin-right:6px;line-height:1.75;font-family:var(--f-ui)}
.c-best{color:var(--best);background:var(--best-soft)}.c-ok{color:var(--ok);background:var(--ok-soft)}.c-poor{color:var(--poor);background:var(--poor-soft)}.c-danger{color:#fff;background:#B91C1C}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:14.5px;padding:10px 18px;border-radius:6px;background:var(--accent);color:var(--accent-ink);letter-spacing:.04em;text-align:center}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.note{font-size:12px;opacity:.7;max-width:72ch}
/* ===== scene skeleton (novel skin = default) ===== */
.sc{display:flex;flex-direction:column;gap:12px}
.sc-head{position:relative;background:var(--stage);color:var(--stage-ink);border-radius:10px;padding:16px 20px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.sc-head::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 40%,rgba(77,178,174,.18),transparent 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.sc-no{position:relative;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;opacity:.7}
.sc-ph{position:relative;margin:0;font-family:var(--f-novel);font-weight:700;font-size:clamp(22px,4.2vw,32px);line-height:1.3}
.sc-media{position:relative;font-family:var(--f-mono);font-size:11px;opacity:.55}
.hud{display:none}
.story{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.who{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);background:var(--accent);padding:0 10px;border-radius:3px}
.txt{font-family:var(--f-novel);font-size:16.5px;line-height:1.95;max-width:62ch;min-height:5.5em}
.txt p{margin:0 0 .35em}
.ask{font-family:var(--f-novel);font-weight:700;font-size:18px;color:var(--accent)}
.banner{font-size:13px;font-weight:700;color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;line-height:1.65;min-width:0;transition:transform .15s,border-color .15s,background .15s}
.opt:hover:not([aria-disabled="true"]){border-color:var(--accent);transform:translateY(-1px)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;font-family:var(--f-mono);font-size:12px;min-width:22px;height:22px;border-radius:4px;display:grid;place-items:center;border:1px solid var(--line);opacity:.8;margin-top:2px}
.opt .t{min-width:0;flex:1}
.opt .tag{display:block;margin-top:6px;font-size:12.5px;opacity:.85}
.opt .tag:empty{display:none}
.opt[aria-disabled="true"]{cursor:default}
.opt.dim{opacity:.55}
.opt.hidden50{visibility:hidden}
.opt.picked{outline:3px solid var(--accent);outline-offset:-3px}
.opt.v-best{border-color:var(--best)}.opt.v-danger{border-color:#B91C1C}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.fb:empty{display:none}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.flavor{font-weight:700;font-size:14px}
.verdict{font-family:var(--f-novel);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb h4{margin:0 0 2px;font-size:12px;letter-spacing:.12em;opacity:.7;font-weight:700}
.fb p{margin:0;max-width:66ch}
.better{border-left:3px solid var(--best);padding-left:12px}
.quote{font-family:var(--f-novel);font-size:16px;line-height:1.85;margin:0;padding:10px 14px;background:var(--accent-soft);border-radius:6px}
.quote cite{display:block;margin-top:2px;font-family:var(--f-mono);font-style:normal;font-size:11.5px;opacity:.7}
.std{font-size:13.5px;opacity:.8}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-family:var(--f-novel);font-size:20px}
.thgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.thc{all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;padding:14px;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:2px solid transparent;color:#fff}
.thc b{font-size:16px}.thc span{font-size:12px;opacity:.85;line-height:1.5}
.thc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.thc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t-novel{background:linear-gradient(160deg,#173133,#0B1517);font-family:var(--f-novel)}
.t-quiz{background:radial-gradient(circle at 50% 30%,#3B3FB8,#0A0C3A 70%)}
.t-rpg{background:#000;border:3px solid #fff!important;border-radius:8px;font-family:var(--f-dot)}
.t-rpg[aria-pressed="true"]{outline:3px solid var(--accent)}
.t-arcade{background:linear-gradient(180deg,#2B0B4A,#0B0322);box-shadow:inset 0 0 0 2px #FF3EC9}
.t-shuffle{background:conic-gradient(from 45deg,#173133,#3B3FB8,#000,#2B0B4A,#173133)}
.prol{font-family:var(--f-novel);font-size:16px;line-height:2}
.prol p{margin:0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dex div{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;min-height:56px}
.dex div.got{border:1px solid #B91C1C;background:rgba(185,28,28,.08)}
.dex b{display:block;font-size:11px;opacity:.7;font-family:var(--f-mono)}
.big{font-family:var(--f-novel);font-weight:700;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;opacity:.7}
/* ===== QUIZ SHOW skin ===== */
body.th-quiz{background:radial-gradient(ellipse 80% 60% at 50% 0%,#2A2F9E,#090B2E 60%,#04051A);color:#EEF0FF}
.th-quiz .sc-head{background:transparent;text-align:center;align-items:center;min-height:90px}
.th-quiz .sc-head::before{background:radial-gradient(ellipse 40% 90% at 50% 0%,rgba(255,255,255,.18),transparent 70%)}
.th-quiz .sc-ph{font-family:var(--f-heavy);font-weight:400;color:#FFD86B;text-shadow:0 0 18px rgba(255,200,80,.5)}
.th-quiz .hud{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.th-quiz .lad{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.25);opacity:.7}
.th-quiz .lad.cur{background:#F59E0B;color:#111;opacity:1;border-color:#F59E0B;font-weight:700}
.th-quiz .lad.won{background:rgba(255,216,107,.25);color:#FFD86B;opacity:1}
.th-quiz .lad.lost{opacity:.35;text-decoration:line-through}
.th-quiz .story{background:linear-gradient(180deg,#141A6E,#0A0E46);border:2px solid #9AA8FF;border-radius:999px/60px;color:#fff;padding:18px 34px;box-shadow:0 0 20px rgba(120,140,255,.35)}
.th-quiz .who{background:#F59E0B;color:#111}
.th-quiz .txt{font-family:var(--f-ui);font-weight:500;color:#fff}
.th-quiz .ask{text-align:center;color:#FFD86B;font-family:var(--f-heavy);font-weight:400}
.th-quiz .ll{display:flex;gap:10px;justify-content:center}
.lifeb{all:unset;cursor:pointer;width:64px;height:40px;border-radius:50%;border:2px solid #9AA8FF;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:radial-gradient(#2B35B0,#0A0E46)}
.lifeb[disabled]{opacity:.3;cursor:default;text-decoration:line-through}
.lifeb:focus-visible{outline:2px solid #FFD86B;outline-offset:2px}
.th-quiz .opt{background:linear-gradient(180deg,#141A6E,#0A0E46);color:#fff;border:2px solid #9AA8FF;border-radius:0;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%);padding:14px 28px}
.th-quiz .opt .k{border:none;color:#F59E0B;font-weight:700;font-size:15px;opacity:1}
.th-quiz .opt.sel{background:linear-gradient(180deg,#F59E0B,#C2410C);color:#111}
.th-quiz .opt.sel .k{color:#111}
.th-quiz .opt.suspense{animation:qpulse .5s infinite alternate}
@keyframes qpulse{to{filter:brightness(1.35)}}
.th-quiz .opt.v-best{background:linear-gradient(180deg,#22C55E,#0F6E56);color:#fff;animation:qwin .3s 4 alternate}
.th-quiz .opt.v-danger,.th-quiz .opt.v-poor,.th-quiz .opt.v-ok{background:linear-gradient(180deg,#F59E0B,#C2410C);color:#111}
@keyframes qwin{to{filter:brightness(1.6)}}
.th-quiz .lock{text-align:center}
.th-quiz .btn{background:#F59E0B;color:#111}
.th-quiz .fb,.th-quiz .panel{background:#0A0E46;border:2px solid #9AA8FF;color:#fff}
.th-quiz .quote{background:rgba(255,255,255,.08)}
.th-quiz .aud{display:flex;gap:10px;align-items:flex-end;justify-content:center;height:90px;padding:6px}
.th-quiz .aud div{width:42px;background:linear-gradient(#FFD86B,#F59E0B);border-radius:3px 3px 0 0;position:relative;transition:height .8s}
.th-quiz .aud div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px}
.th-quiz .aud div i{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;font-style:normal}
/* ===== RPG skin ===== */
body.th-rpg{background:#000;color:#fff;font-family:var(--f-dot)}
.th-rpg .brand,.th-rpg .txt,.th-rpg .ask,.th-rpg .sc-ph,.th-rpg .verdict,.th-rpg .quote,.th-rpg .panel h3{font-family:var(--f-dot)!important;font-weight:400}
.th-rpg .win,.th-rpg .story,.th-rpg .opts,.th-rpg .fb,.th-rpg .panel,.th-rpg .sc-head{background:#000;border:3px solid #fff;border-radius:10px;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 5px #fff;color:#fff}
.th-rpg .sc-head{min-height:0;padding:12px 18px}.th-rpg .sc-head::before{display:none}
.th-rpg .sc-ph{font-size:22px}
.th-rpg .hud{display:flex;gap:10px;flex-wrap:wrap}
.th-rpg .hud .win{padding:8px 14px;font-size:14px;line-height:1.6;min-width:180px}
.hp{display:inline-block;width:100px;height:8px;border:1px solid #fff;vertical-align:middle;margin-left:6px}
.hp i{display:block;height:100%;background:#fff;transition:width .6s}
.hp.low i{background:#FF5252}
.th-rpg .who{background:#fff;color:#000;border-radius:0}
.th-rpg .txt{font-size:17px;line-height:1.9}
.th-rpg .ask{color:#fff}
.th-rpg .opts{display:flex;flex-direction:column;gap:2px;padding:10px 14px}
.th-rpg .opt{background:transparent;border:none;border-radius:0;padding:6px 6px;color:#fff;font-family:var(--f-dot)}
.th-rpg .opt .k{border:none;color:transparent;min-width:18px;font-family:var(--f-dot)}
.th-rpg .opt .k::before{content:"▶";color:#fff;opacity:0}
.th-rpg .opt:hover .k::before,.th-rpg .opt:focus .k::before,.th-rpg .opt.picked .k::before{opacity:1;animation:blink .6s steps(2) infinite}
.th-rpg .opt:focus-visible{outline:none}
.th-rpg .opt:hover{transform:none}
.th-rpg .opt.picked{outline:none}
@keyframes blink{50%{opacity:0}}
.th-rpg .opt.v-best .t{color:#7CFF9E}.th-rpg .opt.v-danger .t{color:#FF6B6B}
.th-rpg .btn{background:#fff;color:#000;border-radius:0;font-family:var(--f-dot);font-weight:400}
.th-rpg .btn.ghost{background:#000;color:#fff;border:2px solid #fff}
.th-rpg .quote{background:#111}
.th-rpg .chip{border-radius:0}
.th-rpg .flavor{font-family:var(--f-dot);font-weight:400;font-size:16px}
/* ===== ARCADE skin ===== */
body.th-arcade{color:#fff;background:#0B0322 linear-gradient(180deg,#2B0B4A 0%,#0B0322 55%);}
body.th-arcade::after{content:"";position:fixed;left:-50%;right:-50%;bottom:-10vh;height:45vh;z-index:-1;pointer-events:none;
  background:linear-gradient(transparent 0 0),repeating-linear-gradient(90deg,rgba(255,62,201,.35) 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,rgba(255,62,201,.35) 0 2px,transparent 2px 40px);
  transform:perspective(300px) rotateX(60deg);transform-origin:bottom}
.th-arcade .sc-head{background:transparent;border:2px solid #36F1FF;box-shadow:0 0 14px #36F1FF,inset 0 0 14px rgba(54,241,255,.4)}
.th-arcade .sc-head::before{display:none}
.th-arcade .sc-ph{font-family:var(--f-heavy);font-weight:400;color:#FF3EC9;text-shadow:0 0 12px #FF3EC9}
.th-arcade .hud{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-family:var(--f-arc);font-size:11px;color:#36F1FF;text-shadow:0 0 8px #36F1FF}
.th-arcade .hud b{color:#FFE14D;text-shadow:0 0 8px #FFE14D;font-weight:400}
.timer{flex:1;min-width:120px;height:10px;border:1px solid #36F1FF;box-shadow:0 0 6px #36F1FF}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#FF3EC9,#FFE14D);width:100%}
.th-arcade .story{background:rgba(10,0,30,.7);border:2px solid #FF3EC9;box-shadow:0 0 14px rgba(255,62,201,.6);color:#fff}
.th-arcade .who{background:#FF3EC9;color:#fff}
.th-arcade .txt{font-family:var(--f-ui);font-weight:500}
.th-arcade .ask{font-family:var(--f-heavy);font-weight:400;color:#FFE14D;text-shadow:0 0 10px #FFE14D}
.th-arcade .opt{background:rgba(10,0,30,.75);color:#fff;border:2px solid #36F1FF;box-shadow:0 0 10px rgba(54,241,255,.6)}
.th-arcade .opt:hover:not([aria-disabled="true"]){transform:scale(1.02);box-shadow:0 0 18px #36F1FF}
.th-arcade .opt .k{font-family:var(--f-arc);font-size:10px;border-color:#36F1FF;color:#36F1FF}
.th-arcade .opt.v-best{border-color:#7CFF9E;box-shadow:0 0 18px #7CFF9E}
.th-arcade .opt.v-danger{border-color:#FF4D4D;box-shadow:0 0 18px #FF4D4D}
.th-arcade .fb,.th-arcade .panel{background:rgba(10,0,30,.85);border:2px solid #36F1FF;color:#fff}
.th-arcade .btn{background:#FF3EC9;color:#fff;box-shadow:0 0 12px #FF3EC9}
.th-arcade .quote{background:rgba(255,255,255,.07)}
.th-arcade .flavor{font-family:var(--f-arc);font-size:14px;color:#FFE14D;text-shadow:0 0 10px #FFE14D;line-height:1.6}
.pop{position:fixed;z-index:40;font-family:var(--f-arc);font-size:20px;color:#FFE14D;text-shadow:0 0 10px #FF3EC9;pointer-events:none;animation:popup 1.1s ease-out forwards}
@keyframes popup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
/* dark-skin chips */
.th-quiz .c-best,.th-rpg .c-best,.th-arcade .c-best{color:#06261B;background:#7CFF9E}
.th-quiz .c-ok,.th-rpg .c-ok,.th-arcade .c-ok{color:#0A1640;background:#9DB4FF}
.th-quiz .c-poor,.th-rpg .c-poor,.th-arcade .c-poor{color:#3A1300;background:#FFB27A}
.th-quiz .better,.th-rpg .better,.th-arcade .better{border-color:#7CFF9E}
.th-quiz .ctl,.th-rpg .ctl,.th-arcade .ctl,.th-quiz .sel,.th-rpg .sel,.th-arcade .sel{color:#fff}
.th-quiz .dex div,.th-rpg .dex div,.th-arcade .dex div{border-color:rgba(255,255,255,.3)}
/* ===== BAD END overlay ===== */
.bad{position:fixed;inset:0;z-index:60;background:#070000;color:#F3E6E6;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bad::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(185,28,28,.35),transparent 65%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.bad-in{position:relative;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bad-k{font-family:var(--f-arc);font-size:12px;color:#FF5A5A;letter-spacing:.1em}
.bad h2{margin:0;font-family:var(--f-heavy);font-weight:400;font-size:clamp(30px,7vw,56px);line-height:1.15;color:#FF3B3B;text-shadow:0 0 24px rgba(255,0,0,.5)}
.bad .choice{font-size:14px;opacity:.8;border-left:3px solid #B91C1C;padding-left:10px}
.bad .think{font-family:var(--f-novel);font-size:18px;line-height:1.9}
.bad .ring{font-family:var(--f-arc);font-size:28px;color:#FF5A5A}
.bad .bs p{font-family:var(--f-novel);font-size:17.5px;line-height:2;margin:0 0 .6em;opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s}
.bad .bs p.on{opacity:1;transform:none}
.bad .lesson{border:1px solid #B91C1C;border-radius:8px;padding:12px 16px;background:rgba(185,28,28,.15)}
.bad .lesson b{display:block;font-size:12px;letter-spacing:.12em;color:#FF8A8A}
.bad .btn{background:#F3E6E6;color:#200}
.bad .btn[disabled]{opacity:.35;cursor:default}
.bad .btn.ghost{background:transparent;color:#F3E6E6}
.bad .disc{font-size:11.5px;opacity:.55}
.rw{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#000;color:#fff;font-family:var(--f-arc);font-size:clamp(18px,4vw,30px);
  animation:rwf .9s steps(6) forwards}
.rw::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 7px);animation:rwl .15s linear infinite}
@keyframes rwl{to{transform:translateY(7px)}}
@keyframes rwf{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.bad .bs p{opacity:1;transform:none}}
</style>
<style>
/* ---- cut-in overlay ---- */
.ci{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ci-bg{position:absolute;inset:0;background:rgba(5,10,12,.62)}
.ci.best .ci-bg{background:radial-gradient(circle at 60% 50%,rgba(255,214,90,.55),rgba(30,20,0,.75) 70%)}
.ci.ok .ci-bg{background:radial-gradient(circle at 60% 50%,rgba(140,170,255,.45),rgba(5,10,30,.75) 70%)}
.ci.poor .ci-bg{background:linear-gradient(rgba(20,25,60,.82),rgba(10,10,30,.9))}
.ci.danger .ci-bg{background:radial-gradient(circle at 60% 50%,rgba(255,40,40,.55),rgba(40,0,0,.85) 70%)}
.ci-rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,240,180,.28) 0 6deg,transparent 6deg 14deg);animation:ci-spin 6s linear infinite;display:none}
.ci.best .ci-rays{display:block}
.ci.danger .ci-rays{display:block;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 3deg,transparent 3deg 9deg);animation-duration:2.5s}
.ci-stage{position:relative;width:min(92vw,760px);height:min(78vh,560px);display:flex;align-items:center;justify-content:flex-end}
.ci-card{position:relative;height:100%;aspect-ratio:330/495;max-width:62vw;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);
  background:#fff;padding:6px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.ci-card img{display:block;width:100%;height:100%;object-fit:cover;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)}
.ci-word{position:absolute;left:0;top:6%;z-index:3;font-family:"Bangers","Impact",sans-serif;font-size:clamp(46px,11vw,112px);line-height:.9;letter-spacing:.03em;
  color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:6px 6px 0 #111;transform:rotate(-8deg);white-space:nowrap}
.ci.best .ci-word{color:#FFD43B} .ci.ok .ci-word{color:#8FB2FF} .ci.poor .ci-word{color:#B9C3E6} .ci.danger .ci-word{color:#FF3B3B}
.ci-bubble{position:absolute;left:2%;bottom:10%;z-index:3;max-width:min(46vw,330px);background:#fff;color:#111;border:3px solid #111;border-radius:22px;
  padding:12px 18px;font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:clamp(17px,3.6vw,26px);line-height:1.35;box-shadow:5px 5px 0 #111}
.ci-bubble::after{content:"";position:absolute;right:-22px;top:34%;border:12px solid transparent;border-left:22px solid #111}
.ci-bubble::before{content:"";position:absolute;right:-15px;top:calc(34% + 3px);border:9px solid transparent;border-left:17px solid #fff;z-index:1}
.ci-skip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));font:12px var(--f-ui);color:rgba(255,255,255,.75);z-index:4}
.ci-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.ci.danger .ci-flash{background:#ff1e1e}
.ci-conf{position:absolute;top:-4vh;width:10px;height:16px;z-index:2;animation:ci-fall linear forwards}
@media (max-width:600px){
  .ci-stage{justify-content:center;height:72vh}
  .ci-card{max-width:78vw;height:auto;width:72vw}
  .ci-word{top:2%;left:-2%}
  .ci-bubble{left:0;bottom:4%;max-width:70vw}
  .ci-bubble::after,.ci-bubble::before{display:none}
}
/* motion */
.ci.go .ci-flash{animation:ci-flash .45s ease-out}
.ci.best.go .ci-card{animation:ci-rise .55s cubic-bezier(.2,1.6,.4,1)}
.ci.ok.go .ci-card{animation:ci-slide .45s cubic-bezier(.2,1.3,.4,1)}
.ci.poor.go .ci-card{animation:ci-sink .9s cubic-bezier(.3,1.4,.5,1)}
.ci.danger.go .ci-card{animation:ci-slam .4s cubic-bezier(.2,1.5,.4,1)}
.ci.go .ci-word{animation:ci-pop .5s .15s cubic-bezier(.2,1.8,.4,1) both}
.ci.danger.go .ci-word{animation:ci-stamp .35s .1s cubic-bezier(.3,1.6,.5,1) both}
.ci.poor.go .ci-word{animation:ci-droop 1s .2s ease-out both}
.ci.go .ci-bubble{animation:ci-pop .4s .35s cubic-bezier(.2,1.6,.4,1) both}
.ci.danger.go .ci-stage{animation:ci-shake .5s .05s 2}
.ci.danger.go .ci-flash{animation:ci-flash .3s ease-out 3}
.shake-page{animation:ci-shake .45s 2}
@keyframes ci-spin{to{transform:rotate(360deg)}}
@keyframes ci-flash{0%{opacity:.85}100%{opacity:0}}
@keyframes ci-rise{0%{transform:translateY(80%) scale(.8)}100%{transform:none}}
@keyframes ci-slide{0%{transform:translateX(110%)}100%{transform:none}}
@keyframes ci-sink{0%{transform:translateY(-30%)}60%{transform:translateY(8%)}100%{transform:none}}
@keyframes ci-slam{0%{transform:scale(2.2) rotate(6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes ci-pop{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.ci-bubble{transform-origin:right center}
.ci.go .ci-bubble{animation-name:ci-pop2}
@keyframes ci-pop2{0%{transform:scale(0);opacity:0}100%{transform:none;opacity:1}}
@keyframes ci-stamp{0%{transform:scale(3.5) rotate(-8deg);opacity:0}70%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
@keyframes ci-droop{0%{transform:translateY(-40px) rotate(-8deg);opacity:0}100%{transform:translateY(6px) rotate(4deg);opacity:1}}
@keyframes ci-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-10px,-4px)}80%{transform:translate(8px,6px)}}
@keyframes ci-fall{to{transform:translateY(112vh) rotate(720deg)}}
.fx-toggle{all:unset;cursor:pointer;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.fx-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.ci *{animation:none!important}.ci-rays{display:none!important}.shake-page{animation:none!important}}
</style>

  why:"近接視のままでは方向を失いやすい。交代時は「フィンガークラッチ調整 → カメラを引く → ランドマーク確認 → 操作開始」を毎回のルーティンにする。",
  quote:{text:"視野を全体的に見て。点じゃなくて。", who:"キョージュ", src:"RALP 2026/3/24", ts:"02:05"},
  std:"Retzius腔展開では恥骨弓、精管、外腸骨静脈が基本のランドマーク。近接して迷ったら、まず引いて見る。",
  media:{label:"RALP 2026/3/24", ts:"02:05", src:""}},

{ id:"traction", phase:"Retzius腔の展開", short:"牽引",
  situation:"腹膜を切開し、膀胱前腔（Retzius腔）に入った。右手のシザースで剥離しているが、組織がたわんで層が出てこない。左手（1番アーム）は切開線から離れた腹膜をつまんでいる。",
  choices:[
    {t:"左手を切開ラインの近くに持ち替え、恥骨弓と精管のラインに緊張がかかる方向へ、じわっと引いてから切る。", r:"best", why:"緊張がかかれば層は自然に開き、右手は軽く触れるだけで切れる。"},
    {t:"右手の剥離を細かく速くして、たわんだ組織を少しずつ削る。", r:"poor", why:"トラクションがないまま右手で頑張っても層は出ない。時間だけがかかる。"},
    {t:"左手で一気にグッと強く引いて層を出す。", r:"poor", why:"一気に引くと組織が裂けて出血する。じわじわ引いて、ちぎれないところで止めるのが原則。"},
    {t:"助手に吸引管で反対側を押してもらい、カウンタートラクションを作る。", r:"ok", why:"助手の吸引は「第3の手」として有効。ただし先に自分の左手の把持位置を直すべき。"}],
  why:"剥離の速さは右手ではなく左手で決まる。把持位置は切開ラインの直近、引く方向は層に緊張がかかる方向。",
  quote:{text:"左手をよく引いている、だから魔法のように勝手に切れる。", who:"キョージュ", src:"RALP 2026/3/24", ts:"26:34"},
  quote2:{text:"恥骨のラインを見ていれば迷わない。", who:"キョージュ", src:"RARP999 2026/4/21", ts:""},
  std:"ロボット手術の剥離はトラクションとカウンタートラクションで決まる。術者の非利き手と助手の吸引で面を作る。",
  media:{label:"RALP 2026/3/24", ts:"26:34", src:""}},

{ id:"cut", phase:"膜の切開", short:"切り方",
  situation:"緊張のかかった膜を切開していく。モノポーラシザースの先端を組織に押し当てて通電すると、速く進むような気がする。",
  choices:[
    {t:"左手で緊張をかけ、張った膜にシザースを軽く当てて「フワッと」切る。押し付けない。", r:"best", why:"緊張がかかっていれば、押し付けなくても切れる。熱が深部へ広がらない。"},
    {t:"先端を組織に押し付けたまま通電し、そのまま奥へ押し進める。", r:"danger", why:"押し付けると熱が深部へ広がり、裏側の直腸・神経・血管に遅れて損傷が出ることがある。術中には気づけない。"},
    {t:"通電せず、コールドシザースで少しずつ切る。", r:"ok", why:"熱損傷は避けられる。ただし血管を含む層では出血を招くので、場面を選ぶ。"},
    {t:"出力を上げて、短時間で一気に切り抜ける。", r:"poor", why:"出力を上げても押し付けの癖は解決しない。焦げて層が見えにくくなる。"}],
  why:"最も多く指摘された癖が「押し付け切り」。緊張のかかったところを軽く触れて切るのが基本。",
  quote:{text:"緊張がかかったところをフワッと切る。", who:"キョージュ", src:"RALP 2026/3/24", ts:"複数回"},
  std:"モノポーラの熱拡散と遅発性熱損傷（直腸穿孔など）はRARPの重要な合併症要因。接触時間と押し付けを最小にする。",
  media:{label:"RALP 2026/3/24", ts:"", src:""}},

{ id:"sdv", phase:"前立腺前脂肪の処理", short:"表在静脈",
  situation:"前立腺前面の脂肪を取り除いていると、正中に表在背静脈（superficial dorsal vein）の枝が走っているのが見えた。",
  choices:[
    {t:"切る前に、静脈に沿って長めの距離をバイポーラで十分に凝固してから切離する。", r:"best", why:"先に焼いておけば、切った後に出血しない。"},
    {t:"細いので、そのままモノポーラで切る。出血したらそのとき止める。", r:"poor", why:"出血した静脈は縮んで脂肪の中に潜り、止めにくくなる。"},
    {t:"静脈にクリップをかけてから切る。", r:"ok", why:"確実ではある。ただしクリップが後の視野やDVC処理の邪魔になることがある。"},
    {t:"脂肪ごと鈍的にむしり取る。", r:"danger", why:"静脈を引きちぎり、恥骨下で出血する。視野が赤くなり、その後の頸部処理が難しくなる。"}],
  why:"静脈は「出血してから」ではなく「出血する前に」処理する。長い距離を焼いてから切るのが原則。",
  quote:{text:"出血してから切ると大変だから、長い距離焼いてから切る。", who:"キョージュ", src:"RARP1002 2026/5/8", ts:"約0:32"},
  quote2:{text:"一番初めに表在背静脈を焼く。", who:"キョージュ", src:"RARP1017 2026/7/14", ts:"0:24"},
  std:"前立腺前脂肪の除去で膀胱頸部と内骨盤筋膜の境界が見えるようになる。表在背静脈は先に凝固してから処理する。",
  media:{label:"RARP1002 2026/5/8", ts:"約0:32", src:""}},

{ id:"neck", phase:"膀胱頸部", short:"膀胱頸部",
  situation:"膀胱頸部に到達した。前立腺と膀胱の境界がはっきりせず、指導医から「前立腺に寄ってる」と声がかかった。",
  choices:[
    {t:"助手にカテーテルを動かしてもらい、動くところ（膀胱）と動かないところ（前立腺）を見て境界を決める。", r:"best", why:"可動性の差で境界が見える。両手で膀胱を触れてシルエットを確かめるのも同じ考え方。"},
    {t:"前立腺に切り込むよりはと、思い切って膀胱側に大きく寄せて切開する。", r:"poor", why:"膀胱頸部が大きく開き、吻合で径の差を埋める縫縮が必要になる。尿管口にも近づく。"},
    {t:"今のラインのまま深く切り進め、内腔に入ってから確認する。", r:"poor", why:"前立腺に寄ったまま入ると、前立腺組織に切り込む（断端陽性のリスク）。"},
    {t:"30度斜視鏡に替え、上から見下ろす視野を作ってから見直す。", r:"ok", why:"視野の改善は有効。ただし境界の判定には可動性の確認を組み合わせたい。"}],
  why:"境界は「見た目」より「動き」で判断する。内尿道口は丸く残すようにデザインすると、後の膀胱尿道吻合が楽になる。",
  quote:{text:"一緒にカテーテルを動かしてもらって、動くところと動かないところを見て。", who:"キョージュ", src:"RARP1001 2026/5/1", ts:"46:00"},
  quote2:{text:"内尿道口が丸くなるようにデザインする。膀胱尿道吻合がしやすいように膀胱を丸く残す。", who:"キョージュ", src:"RARP1007 2026/6/5", ts:"40:51"},
  std:"膀胱頸部温存は尿禁制の早期回復に寄与するとされる。前立腺側に寄ると断端陽性、膀胱側に寄ると頸部が大きく開く。",
  media:{label:"RARP1001 2026/5/1", ts:"46:00", src:""}},

{ id:"sv", phase:"精管・精嚢", short:"精嚢",
  situation:"膀胱頸部の後面を離断し、精管と精嚢が見えてきた。精嚢の外側には、細い血管（精嚢動脈の枝）を含む脂肪が付いている。",
  choices:[
    {t:"精嚢そのものより周囲の脂肪・血管に目を向け、層を見ながら少しずつ剥がす。血管はクリップか凝固で処理する。", r:"best", why:"芋（精嚢）を傷つけないよう土（周囲組織）を掘る感覚。出血させずに外せる。"},
    {t:"精嚢をしっかりつかみ、引き抜くように一気に牽引して剥がす。", r:"poor", why:"血管がちぎれて出血する。精嚢先端の近くにある神経にも牽引がかかる。"},
    {t:"精嚢先端の周りをモノポーラで広く焼きながら剥がす。", r:"danger", why:"精嚢先端は骨盤神経叢・神経血管束に近い。広く焼くと勃起機能や尿禁制に影響しうる。"},
    {t:"先に精管を切離して挙上し、取っ手のように使って精嚢へ進む。", r:"ok", why:"標準的な進め方の一つ。ただし取っ手を一気に引く癖が出ると、同じ問題が起こる。"}],
  why:"精嚢の剥離は「周りを見る」作業。対象物ではなく、その周囲の層と血管に目を向ける。",
  quote:{text:"みんな精嚢に目がいくが、自分は周りに目がいく。", who:"キョージュ", src:"RARP1007 2026/6/5", ts:"1:16:29"},
  quote2:{text:"さつまいもを掘るように。芋を傷つけないように土を退かす。", who:"キョージュ", src:"RARP1001 2026/5/1", ts:"1:21:30"},
  std:"精嚢先端は骨盤神経叢と近接しており、先端部では熱を使わない処理（クリップ・コールド）が推奨される。",
  media:{label:"RARP1001 2026/5/1", ts:"1:21:30", src:""}},

{ id:"denon", phase:"Denonvilliers筋膜・後面剥離", short:"直腸",
  situation:"前立腺の後面を剥離している。ふと見ると剥離面に黄色い脂肪が出てきて、指導医が「デンジャー」と言った。",
  choices:[
    {t:"すぐ手を止め、前立腺側（上目）に戻って層を入り直す。左右の鉗子をV字に開き、前立腺と直腸の間に緊張をかける。", r:"best", why:"黄色い脂肪は直腸前脂肪。層が直腸側に落ちているサイン。上目に戻れば修正できる。"},
    {t:"脂肪の層は剥がれやすいので、そのまま脂肪の層で剥離を進める。", r:"danger", why:"その層の下は直腸。進めるほど直腸損傷のリスクが上がる。"},
    {t:"出血していないので、もう少しだけ進めて様子をみる。", r:"poor", why:"出血の有無は層が正しい証拠にならない。直腸損傷は出血なしで起こる。"},
    {t:"いったんカメラを引いて全体を見て、精嚢と前立腺の位置関係を確認する。", r:"ok", why:"全体を見直すのは良い判断。ただしその後、必ず上目の層へ戻ること。"}],
  why:"迷ったら上目（前立腺側）から入る。上から下へは修正できるが、下に入ってしまうと直腸の上を進むことになる。",
  quote:{text:"危険だよ、直腸を損傷する。", who:"キョージュ", src:"RARP1005 2026/5/19", ts:"1:29"},
  quote2:{text:"迷ったときは上目で入っておいて、下に修正し直すことはできるから。", who:"保科先生", src:"RARP997 2026/4/16", ts:"1:15:28"},
  std:"Denonvilliers筋膜と直腸前脂肪の間の層を保つ。直腸損傷はRARPの重大合併症で、術中に気づけば一期的修復が可能。",
  media:{label:"RARP1005 2026/5/19", ts:"1:29", src:""}},

{ id:"nvb", phase:"側方茎・神経温存", short:"神経温存",
  situation:"今日は右側の神経温存。右の側方茎を処理し、前立腺被膜に沿って神経血管束を外していく。",
  choices:[
    {t:"エネルギーデバイスは使わず、クリップとコールドシザースで処理する。", r:"best", why:"神経線維は熱に弱い。温存側では熱を出さない処理が原則。"},
    {t:"バイポーラで軽く凝固しながら切る。", r:"poor", why:"弱い通電でも熱は周囲に広がり、神経血管束を傷める。"},
    {t:"出血を減らすため、モノポーラで側方茎をまとめて焼き切る。", r:"danger", why:"神経温存の意味がなくなる。術後の勃起機能・尿禁制に直結する。"},
    {t:"小さな出血は圧迫で待ち、どうしても必要な点だけ低出力でピンポイント凝固する。", r:"ok", why:"現実的な対応。ただし神経血管束の近くでは通電を最小限にとどめる。"}],
  why:"温存側は「熱を使わない」が原則。理由は神経線維が熱に弱いから。",
  quote:{text:"なぜなら神経線維が多いから。", who:"キョージュ", src:"RARP 2026/6/30", ts:""},
  quote2:{text:"神経はかけないでいいよ、DVCだけかけて。", who:"キョージュ", src:"RARP1005 2026/5/19", ts:"2:10"},
  std:"Athermal technique（クリップ＋コールドカット）は神経温存で広く推奨される。被膜に沿った剥離層の選択が勃起機能を左右する。",
  media:{label:"RARP 2026/6/30", ts:"", src:""}},

{ id:"bleed", phase:"出血", short:"出血",
  situation:"側方茎を処理した直後、視野の奥から血がわき出し、術野が赤くなってきた。左手は組織を把持したまま。",
  choices:[
    {t:"まず左手と助手で視野を立て直し、ガーゼで圧迫する。少し待ってからゆっくりずらし、出血点を見つけて深めに把持し、ピンポイントで止血する。", r:"best", why:"視野、圧迫、同定、止血の順番を守れば、落ち着いて止められる。"},
    {t:"見えている赤い部分を手当たり次第にバイポーラで焼く。", r:"danger", why:"盲目的な止血。神経や尿管・直腸を焼くおそれがあり、出血点はかえってわからなくなる。"},
    {t:"左手の鉗子で、出血部をそのまま押さえて止めようとする。", r:"poor", why:"左手を止血に使うと視野を作る手がなくなる。"},
    {t:"気腹圧を上げ、吸引で血を吸いながら出血点を探す。", r:"ok", why:"気腹圧の上昇は静脈出血に有効。ただし吸いすぎると気腹が抜け、視野がつぶれる。"}],
  why:"出血したらまず視野。出血点は見えているより下に潜っているので、深めに把持する。",
  quote:{text:"大体ね、出血点ってね下に潜るから、見えてるより深めに持つんだよ。", who:"キョージュ", src:"RARP 2026/3/27", ts:""},
  quote2:{text:"盲目的止血は技術認定でも減点。", who:"キョージュ", src:"RARP999 2026/4/21", ts:"1:00:00"},
  std:"出血時は圧迫と視野確保を優先し、出血点を同定してから止血する。気腹圧の一時的な上昇は静脈性出血の制御に有用。",
  media:{label:"RARP999 2026/4/21", ts:"1:00:00", src:""}},

{ id:"dvc", phase:"DVC（背静脈群）", short:"DVC",
  situation:"いよいよDVC（背静脈群）の処理に入る。前立腺尖部の前面にDVCが見えてきた。",
  choices:[
    {t:"気腹圧を上げて（例：15mmHg）静脈出血を抑え、1番で前立腺を押し下げてDVCを立てる。出血したときの手順を頭の中で確認してから処理する。", r:"best", why:"準備してから切れば、出血しても慌てない。DVCが立てば、処理する範囲がはっきりする。"},
    {t:"今の気腹圧のまま進め、出血したらそのとき考える。", r:"poor", why:"DVCからの出血は急に視野を奪う。準備なしでは対応が後手になる。"},
    {t:"温存側も含め、神経血管束ごと大きく運針して縫い上げる。", r:"danger", why:"温存側の神経を縫い込んでしまう。神経温存の努力が無駄になる。"},
    {t:"DVCに先に運針・結紮してから切離する。", r:"ok", why:"標準的な方法の一つ。ただし深くかけすぎると括約筋を巻き込む。"}],
  why:"DVCは「準備8割」。気腹圧、視野（DVCを立てる）、出血時のリハーサルをそろえてから処理する。",
  quote:{text:"気腹圧を15に上げて静脈出血を防ぐ。", who:"キョージュ", src:"RARP1014 2026/7/7", ts:"0:46"},
  quote2:{text:"お相撲さんのちょんまげのように。1番で前立腺を大胆に押し下げて、DVCを立てる。", who:"キョージュ", src:"RARP1005 2026/5/19", ts:"2:00"},
  std:"DVCの処理法には先行結紮と切離後縫合があり、施設により異なる。いずれも括約筋と神経血管束を巻き込まないことが要点。",
  media:{label:"RARP1014 2026/7/7", ts:"0:46", src:""}},

{ id:"apex", phase:"前立腺尖部・尿道", short:"尿道",
  situation:"DVCを処理し、前立腺尖部と尿道が見えてきた。尿道をどの位置で切るかを決める。",
  choices:[
    {t:"尖部の形（腹側・背側への張り出し）を確かめ、前立腺に切り込まない範囲で尿道をできるだけ長く残して切る。", r:"best", why:"尿道を長く残すほど尿禁制に有利。尖部の形を見れば、切り込まない限界がわかる。"},
    {t:"断端陽性が怖いので、尖部から余裕をもって離れ、尿道を短めに残して切る。", r:"poor", why:"尿道が短くなると術後の尿失禁リスクが上がる。"},
    {t:"尖部の形を確かめず、見えている位置でまっすぐ切る。", r:"poor", why:"尖部は背側に張り出していることがある。まっすぐ切ると前立腺に切り込み、断端陽性になる。"},
    {t:"カメラ（30度）を下向きにして、尖部の背側を確認してから切る。", r:"ok", why:"背側の張り出しを確認できる良い手順。そのうえで尿道長を最大にするラインを決める。"}],
  why:"尿禁制（尿道長）と根治性（断端）のバランスをとる場面。1cmの差が術後の生活を左右する。",
  quote:{text:"この1cmは大違い。人工尿道括約筋かパッドフリーか。", who:"キョージュ", src:"RARP999 2026/4/21", ts:"2:28:54"},
  std:"機能的尿道長の温存は尿禁制回復と関連する。一方で尖部は断端陽性の好発部位であり、形態の確認が必須。",
  media:{label:"RARP999 2026/4/21", ts:"2:28:54", src:""}},

{ id:"anast", phase:"膀胱尿道吻合", short:"吻合",
  situation:"膀胱尿道吻合の後壁。連続縫合で数針かけたので、糸を締めて膀胱を尿道に寄せたい。",
  choices:[
    {t:"尿道側は手繰らず（引くなら真上方向に）、膀胱側の糸で手繰って寄せる。針ではなく糸を持って回す。", r:"best", why:"尿道は脆い。膀胱側で手繰れば、尿道を裂かずに寄せられる。"},
    {t:"尿道側の糸を斜めに強く引いて、一気に締める。", r:"danger", why:"尿道がちぎれる。吻合のやり直しや縫合不全につながる。"},
    {t:"毎針ごとに強く手繰って、確実に締めていく。", r:"poor", why:"非効率で、糸切れや組織の裂傷が増える。手繰りは2〜3針に1回でよい。"},

  $("#fb").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});setTimeout(()=>{const n=$("#next");n&&n.focus({preventScroll:true})},reduce?0:400);
}
/* ---------- BAD END ---------- */
function badEnd(i,ci){
  const s=SCENES[i],c=s.choices[ci],b=c.bad,no=String(i+1).padStart(2,"0");const firstTime=!S.bad.includes(i);if(firstTime)S.bad.push(i);
  const best=s.choices.find(x=>x.r==="best");
  const el=document.createElement("div");el.className="bad";el.setAttribute("role","dialog");el.setAttribute("aria-label","BAD END");
  el.innerHTML=`<div class="bad-in"><div class="bad-k">BAD END ROUTE ── SCENE ${no}</div>
   <p class="choice">私の選択：${esc(c.t)}</p>
   <div id="b2"><div class="bad-k">BAD END ${no}</div><h2>${esc(b.title)}</h2><div class="bs" id="bs">${b.story.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
     <div class="lesson" id="les" hidden><b>教訓</b>${esc(b.lesson)}<br><span style="font-size:13.5px;opacity:.85">${esc(c.why)}</span></div>
     <div class="lesson" id="les2" hidden><b>分岐点で選ぶべきだった行動</b>${esc(best.t)}</div>
     <p class="disc">※教育用に構成した架空の経過である。実際の転帰は症例により異なる。</p>
     <div class="row" id="brow" hidden><span style="margin-right:auto;font-size:13px;opacity:.8">BAD END 回収 ${S.bad.length} / ${N}</span><button class="btn" id="back">⟲ 分岐点に戻る</button></div></div></div>`;
  document.body.appendChild(el);SFX.bad();
  const openBad=()=>{const ps=[...el.querySelectorAll("#bs p")];let k=0;
    const show=()=>{if(k<ps.length){ps[k++].classList.add("on");SFX.blip();setTimeout(show,reduce?0:1100)}else{$("#les").hidden=false;$("#les2").hidden=false;$("#brow").hidden=false;$("#back").focus({preventScroll:true})}};show();
    el.querySelector("#bs").onclick=()=>{k=ps.length;ps.forEach(p=>p.classList.add("on"));show()}};openBad();
  el.querySelector("#back").onclick=()=>{el.remove();rewind()};
}
function rewind(){
  SFX.rewind();const w=document.createElement("div");w.className="rw";w.textContent="◀◀ REWIND";document.body.appendChild(w);
  setTimeout(()=>{w.remove();scene({rewound:true});window.scrollTo({top:0});const bn=$("#bn");bn&&bn.scrollIntoView({block:"center"})},reduce?50:850);
}
function next(){if(S.pos<N-1){S.pos++;scene();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"})}else result()}
/* ---------- result ---------- */
function result(){
  S.screen="result";const th="quiz";setBody(th);hdr();
  let p=0,b=0;for(let i=0;i<N;i++){const f=S.first[i];if(f!=null){const r=SCENES[i].choices[f].r;p+=R[r].pt;if(r==="best")b++}}
  const pct=Math.round(100*p/(N*3));
  const head=th==="quiz"?"":th==="rpg"?`わたし Lv ${lv()}　かんじゃ HP ${S.hp}/100`:th==="arcade"?`HI-SCORE ${String(S.ascore).padStart(7,"0")}　MAX COMBO x${S.maxCombo}`:"";
  const msg=pct>=90?"判断の型が身についている。次は、指導医として理由を言葉にする番である。":pct>=70?"大筋は良い。最善でなかった場面と、未回収のBAD ENDを見直そう。":"迷いやすい場面がはっきりした。BAD ENDも含めて、もう一周してみよう。";
  $("#view").innerHTML=`<div class="panel"><div class="big">${pct}<small> %　（${p} / ${N*3} 点・最善 ${b} / ${N}）</small></div>${head?`<div class="flavor">${esc(head)}</div>`:""}<p style="margin:0">${msg}</p>
   <h3>BAD END図鑑　${S.bad.length} / ${N}</h3>
   <div class="dex">${SCENES.map((s,i)=>{const got=S.bad.includes(i);const bd=s.choices.find(c=>c.r==="danger").bad;return `<div class="${got?"got":""}"><b>${String(i+1).padStart(2,"0")} ${esc(s.short)}</b>${got?esc(bd.title):"？？？"}</div>`}).join("")}</div>
   <p class="std" style="margin:0">未回収のBAD ENDは、最悪の選択肢を選ぶと見られる。最悪を知っておくことも、判断力の一部である。</p>
   <div class="row"><button class="btn ghost" id="redo">未回収のBAD ENDを回る</button><button class="btn" id="again">タイトルへ</button></div></div>`;
  $("#again").onclick=()=>{S=fresh(S.theme);title();window.scrollTo({top:0})};
  $("#redo").onclick=()=>{const miss=SCENES.map((_,i)=>i).filter(i=>!S.bad.includes(i));if(!miss.length){$("#redo").textContent="すべて回収済み";return}S.pos=miss[0];S.screen="scene";scene({keep:true});window.scrollTo({top:0})};
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(S.screen!=="scene"||document.querySelector(".bad,.ci,.rw")||e.metaKey||e.ctrlKey||e.altKey)return;
  const th=thOf(S.pos);const o=$("#opts");if(!o||o.hidden)return;
  const opts=[...o.querySelectorAll(".opt:not(.hidden50)")];
  const map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};const k=map[e.key.toLowerCase()];
  if(k!=null&&!S.locked){const b=o.children[k];if(b&&!b.classList.contains("hidden50")){e.preventDefault();b.click()}return}
  if(th==="rpg"&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&!S.locked){e.preventDefault();const cur=opts.indexOf(document.activeElement);const n=(cur+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length;opts[n].focus();SFX.blip()}
  if(e.key==="Enter"&&typing){e.preventDefault();$("#story").click()}
});
/* ---------- boot ---------- */
function boot(d){if(d&&d.S){S=d.S;if(S.screen==="scene")scene({keep:true});else if(S.screen==="result")result();else title()}else title()}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
</body></html>
